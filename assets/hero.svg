<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="45%" stop-color="#190B12" />
      <stop offset="80%" stop-color="#10070C" />
      <stop offset="100%" stop-color="#140810" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="wineGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="roseAccentGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Text & Accent Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8F0F3" />
      <stop offset="100%" stop-color="#E5B5C7" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1">
        <animate attributeName="stop-color" values="#C77B9B;#F8F0F3;#C77B9B" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#190B12" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.16" />
      <circle cx="40" cy="0" r="1" fill="#C77B9B" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-display { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: 4px; }
    
    @keyframes pulseSoft {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#wineGlow)" />
  <rect width="1200" height="420" fill="url(#roseAccentGlow)" />
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Restrained Orbital Geometry (Top Right) -->
  <g transform="translate(1000, 100)" opacity="0.45">
    <!-- Outer Orbit -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#701A3D" stroke-width="1.2" stroke-dasharray="4,8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite" />
    </circle>
    <!-- Mid Orbit -->
    <ellipse cx="0" cy="0" rx="95" ry="75" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="8,6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="50s" repeatCount="indefinite" />
    </ellipse>
    <!-- Inner Core Ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#E5B5C7" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="6" fill="#F8F0F3" filter="url(#subtleGlow)">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Orbiting Satellite -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      <circle cx="95" cy="0" r="4" fill="#C77B9B" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Ambient Wave / Dynamic Light Path -->
  <path d="M -50 360 Q 300 320, 600 360 T 1250 340" fill="none" stroke="url(#sweepGrad)" stroke-width="2.5" opacity="0.75" />
  <path d="M -50 375 Q 400 340, 750 375 T 1250 360" fill="none" stroke="#701A3D" stroke-width="1" opacity="0.35" />

  <!-- Top Status Badge -->
  <g transform="translate(600, 78)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="url(#badgeGrad)" stroke="#701A3D" stroke-width="1.5" />
    <!-- Glowing Status Node -->
    <circle cx="-160" cy="0" r="4.5" fill="#C77B9B" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-144" y="5" class="font-mono" font-size="12" font-weight="600" fill="#E5B5C7" letter-spacing="1.8">AI ARCHITECT &amp; CREATIVE ENGINEER</text>
  </g>

  <!-- Primary Headline: GHALIB HUSSAIN -->
  <text x="600" y="180" text-anchor="middle" class="font-display font-sans" font-size="64" fill="url(#nameGrad)" filter="url(#glowFilter)">GHALIB HUSSAIN</text>

  <!-- Luminous Underline -->
  <line x1="280" y1="210" x2="920" y2="210" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="600" cy="210" r="3.5" fill="#F8F0F3" filter="url(#subtleGlow)">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Role Definition Subtitle -->
  <text x="600" y="258" text-anchor="middle" class="font-sans" font-size="19" font-weight="500" fill="#E5B5C7" letter-spacing="3.5">
    COMPUTER VISION <tspan fill="#701A3D">•</tspan> FULL-STACK SYSTEMS <tspan fill="#701A3D">•</tspan> 3D GRAPHICS
  </text>

  <!-- Technical Telemetry Footer Line in Header -->
  <g transform="translate(600, 310)" opacity="0.8">
    <text x="0" y="0" text-anchor="middle" class="font-mono" font-size="12" fill="#A39099" letter-spacing="2">
      PYTORCH <tspan fill="#C77B9B">::</tspan> YOLOV8 <tspan fill="#C77B9B">::</tspan> FASTAPI <tspan fill="#C77B9B">::</tspan> THREE.JS <tspan fill="#C77B9B">::</tspan> REACT <tspan fill="#C77B9B">::</tspan> FLUTTER
    </text>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#701A3D" stroke-width="2" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#701A3D" stroke-width="2" />
  <path d="M 24 376 L 24 396 L 44 396" fill="none" stroke="#701A3D" stroke-width="2" />
  <path d="M 1176 376 L 1176 396 L 1156 396" fill="none" stroke="#701A3D" stroke-width="2" />

  <!-- Coordinates on bottom corners -->
  <text x="50" y="394" class="font-mono" font-size="10" fill="#701A3D" letter-spacing="1">SYS.ID: GH-2026 // READY</text>
  <text x="1150" y="394" text-anchor="end" class="font-mono" font-size="10" fill="#701A3D" letter-spacing="1">STATUS: ONLINE</text>
</svg>
