<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="120" fill="url(#footerBg)" />

  <!-- Top Accent Divider -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="url(#footerLineGrad)" stroke-width="1.5" />
  <circle cx="600" cy="20" r="3" fill="#F8F0F3" filter="url(#fGlow)">
    <animate attributeName="r" values="2.5;4;2.5" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Central Statement -->
  <text x="600" y="65" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#E5B5C7" letter-spacing="3">
    ENGINEERED WITH PRECISION <tspan fill="#701A3D">•</tspan> DESIGNED FOR IMPACT
  </text>

  <!-- Attribution -->
  <text x="600" y="90" text-anchor="middle" class="font-mono" font-size="11" fill="#701A3D" letter-spacing="1.5">
    © 2026 GHALIB HUSSAIN <tspan fill="#C77B9B">::</tspan> ALL SYSTEMS OPERATIONAL
  </text>
</svg>
